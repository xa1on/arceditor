<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcEditor</title>
    <!-- Modern Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body class="dark-theme">
    <div id="arc-root" class="glass-container">
        


        <!-- CHAT SESSIONS CONTROL BAR -->
        <div class="chat-sessions-bar">
            <div class="project-info">
                <span id="label-active-project" title="Active Project">Unsaved Project</span>
            </div>
            <div class="session-selector-wrap">
                <select id="select-chat-session" class="session-select">
                    <option value="new">+ New Chat...</option>
                </select>
                <button id="btn-delete-session" class="icon-btn" title="Delete current chat" style="padding: 2px; margin-left: 4px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text-secondary); cursor: pointer;">
                    <svg viewBox="0 0 24 24" width="11" height="11" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
        </div>

        <!-- MAIN VIEWPORT (TABS) -->
        <div class="view-tabs">
            <button id="tab-chat" class="tab-btn active">Chat</button>
            <button id="tab-console" class="tab-btn">JSX Console</button>
            <button id="tab-debug" class="tab-btn">Debug Log</button>
            <button id="btn-settings" class="icon-btn" title="API Settings">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
        </div>

        <main class="content-viewport">
            <!-- CHAT PANE -->
            <div id="pane-chat" class="view-pane active">
                <div id="chat-messages" class="chat-scroller">
                    <!-- Dynamic Messages will load here -->
                    <div class="message system-msg">
                        <div class="message-content">
                            <p>ArcEditor initialized.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CONSOLE PANE -->
            <div id="pane-console" class="view-pane">
                <div class="console-wrapper">
                    <div class="console-header">
                        <span>JSX Console</span>
                        <div class="console-actions" style="display: flex; align-items: center; gap: 8px;">
                            <button id="btn-run-console" class="txt-btn" style="color: var(--text-accent); font-weight: 600;">Execute Script</button>
                            <button id="btn-clear-console" class="txt-btn">Clear</button>
                        </div>
                    </div>
                    <textarea id="console-output" class="code-viewport" spellcheck="false" placeholder="// Paste or edit ExtendScript code here, then click Execute Script..." style="border: none; background: transparent; outline: none; resize: none;"></textarea>
                </div>
            </div>

            <!-- DEBUG PANE -->
            <div id="pane-debug" class="view-pane">
                <div class="console-wrapper">
                    <div class="console-header">
                        <span>Debug Log</span>
                        <div class="console-actions" style="display: flex; align-items: center; gap: 8px;">
                            <button id="btn-copy-debug" class="txt-btn" style="color: var(--text-accent); font-weight: 600;">Copy Log</button>
                            <button id="btn-clear-debug" class="txt-btn">Clear Log</button>
                        </div>
                    </div>
                    <textarea id="debug-output" class="code-viewport" spellcheck="false" readonly placeholder="// Agent debug logs (Prompts, LLM Raw Responses, and executed Tool Calls) will appear here..." style="border: none; background: transparent; outline: none; resize: none; font-family: 'JetBrains Mono', monospace; font-size: 11px;"></textarea>
                </div>
            </div>
        </main>

        <!-- PERSISTED DOCK PREVIEW (IF ATTACHED) -->
        <div id="frame-attachment-preview" class="attachment-dock hidden">
            <div id="dock-thumbnails" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <!-- Thumbnails will be injected dynamically -->
            </div>
            <button id="btn-remove-attachment" class="close-badge" style="position: static; margin-left: auto; width: auto; height: auto; padding: 2px 6px; border-radius: var(--border-radius-sm); font-size: 9px; line-height: 1.2;">Clear All</button>
            <span class="dock-label" style="margin-left: 8px;">Captured frames</span>
        </div>

        <!-- QUICK CHIPS & UTILITIES -->
        <div class="quick-utilities">
            <button id="chip-capture" class="chip" title="Capture the active frame from After Effects">
                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                <span>Capture Frame</span>
            </button>
            <button id="chip-capture-sequence" class="chip" title="Capture a sequence of 5 frames from the composition">
                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><rect x="2" y="2" width="20" height="20" rx="2.5" ry="2.5"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line></svg>
                <span>Capture Sequence</span>
            </button>
        </div>

        <!-- FOOTER INPUT -->
        <footer class="app-footer" style="display: flex; flex-direction: column;">
            <div class="input-glow-wrapper">
                <textarea id="chat-input" placeholder="Ask Arc to edit, splice, or animate..." rows="1"></textarea>
                <button id="btn-send" class="send-btn" disabled>
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
                <button id="btn-stop" class="stop-btn hidden" title="Stop execution">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                </button>
            </div>
        </footer>

        <!-- DRAWER SETTINGS PANEL -->
        <div id="settings-drawer" class="drawer hidden">
            <div class="drawer-overlay"></div>
            <div class="drawer-content">
                <div class="drawer-header">
                    <h2>API Settings</h2>
                    <button id="btn-close-settings" class="close-btn">&times;</button>
                </div>
                <div class="drawer-body">
                    <form id="form-settings">
                        
                        <div class="field-group">
                            <label for="setting-provider">AI Provider</label>
                            <select id="setting-provider" class="form-input">
                                <option value="lemonade">Lemonade (Local Server)</option>
                                <option value="gemini">Google Gemini</option>
                                <option value="openai">OpenAI (ChatGPT)</option>
                                <option value="anthropic">Anthropic Claude</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label for="setting-url">Base URL</label>
                            <input type="text" id="setting-url" class="form-input" placeholder="http://localhost:1337/v1">
                            <small class="form-tip">Leave empty for standard cloud endpoints.</small>
                        </div>

                        <div class="field-group">
                            <label for="setting-model">Model Name</label>
                            <input type="text" id="setting-model" class="form-input" placeholder="e.g. qwen2.5-coder-7b">
                        </div>

                        <div class="field-group">
                            <label for="setting-key">API Key</label>
                            <div class="password-wrap">
                                <input type="password" id="setting-key" class="form-input" placeholder="API access key">
                            </div>
                        </div>

                        <div class="field-group">
                            <label for="setting-max-tool-retry">Max Tool Turns Limit</label>
                            <input type="number" id="setting-max-tool-retry" class="form-input" min="1" max="100" placeholder="15">
                        </div>

                        <div class="field-group check-group" style="display: flex; align-items: center; gap: 8px; margin-top: 8px; margin-bottom: 8px;">
                            <input type="checkbox" id="setting-include-base64" style="cursor: pointer; width: 16px; height: 16px; accent-color: var(--text-accent);">
                            <label for="setting-include-base64" style="margin: 0; cursor: pointer; user-select: none;">Include Base64 in Debug Logs</label>
                        </div>

                        <div class="drawer-actions" style="display: flex; flex-direction: column; gap: 8px; margin-top: 14px;">
                            <button type="submit" id="btn-save-settings" class="btn-primary">Save & Apply</button>
                            <button type="button" id="btn-inspect-comp" class="btn-secondary">Test Connection</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- Adobe CEP Library -->
    <script src="lib/CSInterface.js"></script>
    <!-- Modularized Controller components -->
    <script src="js/state.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/agent.js"></script>
    <!-- Entry UI Bindings -->
    <script src="index.js"></script>
</body>
</html>
