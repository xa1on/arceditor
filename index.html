<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcEditor</title>
    <!-- Modern Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body class="dark-theme">
    <div id="arc-root" class="glass-container">



        <!-- CHAT SESSIONS CONTROL BAR -->
        <div class="chat-sessions-bar">
            <div id="chat-tabs-list" class="chat-tabs-list">
                <!-- Rendered dynamically -->
            </div>
            <button id="btn-new-chat-tab" class="icon-btn" title="New Chat" style="margin-left: 4px;">
                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <div class="past-chats-wrap" style="margin-left: auto; position: relative; display: flex; align-items: center;">
                <button id="btn-past-chats" class="past-chats-btn" title="Past Chats">
                    <span>Past Chats</span>
                    <svg viewBox="0 0 24 24" width="10" height="10" stroke="currentColor" stroke-width="2.5" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div id="past-chats-dropdown" class="past-chats-dropdown hidden">
                    <!-- Rendered dynamically -->
                </div>
            </div>
        </div>

        <!-- MAIN VIEWPORT (TABS) -->
        <div class="view-tabs">
            <button id="tab-chat" class="tab-btn active">Chat</button>
            <button id="tab-console" class="tab-btn">JSX Console</button>
            <button id="tab-debug" class="tab-btn">Debug Log</button>
            <button id="btn-settings" class="icon-btn" title="API Settings">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
            </button>
        </div>

        <main class="content-viewport">
            <!-- CHAT PANE -->
            <div id="pane-chat" class="view-pane active">
                <!-- Welcome Screen -->
                <div id="welcome-screen" class="welcome-container hidden">
                    <div class="welcome-brand">
                        <img src="assets/archaicv2_colored_blue.png" alt="ArcEditor Logo" class="welcome-logo">
                        <h1 class="welcome-title">ArcEditor</h1>
                    </div>
                    <p class="welcome-subtext">Ask Arc to edit, splice, or animate your compositions</p>
                    
                    <div class="welcome-input-wrapper"
                        style="display: flex; flex-direction: column; align-items: stretch; gap: 4px; position: relative;">
                        <!-- Welcome Quick Utilities -->
                        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;">
                            <button id="welcome-chip-capture" class="chip" title="Capture the active frame from After Effects">
                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none">
                                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                    <circle cx="12" cy="13" r="4"></circle>
                                </svg>
                                <span>Capture Frame</span>
                            </button>
                            <button id="welcome-chip-capture-sequence" class="chip" title="Capture a sequence of 5 frames from the composition">
                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none">
                                    <rect x="2" y="2" width="20" height="20" rx="2.5" ry="2.5"></rect>
                                    <line x1="7" y1="2" x2="7" y2="22"></line>
                                    <line x1="17" y1="2" x2="17" y2="22"></line>
                                </svg>
                                <span>Capture Sequence</span>
                            </button>
                        </div>

                        <textarea id="welcome-chat-input" placeholder="Ask Arc to edit, splice, or animate..." rows="1"
                            style="width: 100%; border: none; outline: none; background: transparent; resize: none;"></textarea>
                        <div id="welcome-command-popup" class="command-autocomplete-popup hidden"></div>
                        <div class="input-controls-row"
                            style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
                            <div class="input-controls-left" style="display: flex; align-items: center; gap: 6px;">
                                <button id="welcome-btn-plus" class="icon-btn" title="Add attachment" type="button">
                                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor"
                                        stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="12" y1="5" x2="12" y2="19"></line>
                                        <line x1="5" y1="12" x2="19" y2="12"></line>
                                    </svg>
                                </button>
                                <select id="welcome-chat-model-select" class="chat-model-select-dropdown">
                                    <!-- Options populated dynamically -->
                                </select>
                            </div>
                            <div class="input-controls-right">
                                <button id="welcome-btn-send" class="send-btn" disabled>
                                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor"
                                        stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="22" y1="2" x2="11" y2="13"></line>
                                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="pinned-plan-container" class="pinned-plan-bar hidden">
                    <div class="pinned-plan-header">
                        <svg class="pinned-plan-icon" viewBox="0 0 24 24" width="12" height="12" stroke="var(--text-accent)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        <span class="pinned-plan-title">Active Execution Plan</span>
                        <svg class="pinned-plan-arrow" viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>

                <div id="chat-messages" class="chat-scroller">
                    <!-- Dynamic Messages will load here -->
                    <div class="message system-msg">
                        <div class="message-content">
                            <p>ArcEditor initialized.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CONSOLE PANE -->
            <div id="pane-console" class="view-pane">
                <div class="console-wrapper">
                    <div id="script-tabs-bar" class="chat-sessions-bar" style="border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 8px; height: 28px; background: var(--bg-surface);">
                        <div id="script-tabs-list" class="chat-tabs-list" style="display: flex; gap: 4px; overflow-x: auto; flex: 1;">
                            <!-- Dynamic script tabs -->
                        </div>
                        <button id="btn-new-script-tab" class="icon-btn" title="Create New Script"
                            style="padding: 4px; margin-left: 4px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text-secondary); cursor: pointer;">
                            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"
                                stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="console-header">
                        <span>JSX Console</span>
                        <div class="console-actions" style="display: flex; align-items: center; gap: 8px;">
                            <button id="btn-run-console" class="txt-btn"
                                style="color: var(--text-accent); font-weight: 600;">Execute Script</button>
                            <button id="btn-clear-console" class="txt-btn">Clear</button>
                        </div>
                    </div>
                    <textarea id="console-output" class="code-viewport" spellcheck="false"
                        placeholder="// Paste or edit ExtendScript code here, then click Execute Script..."
                        style="border: none; background: transparent; outline: none; resize: none;"></textarea>
                </div>
            </div>

            <!-- DEBUG PANE -->
            <div id="pane-debug" class="view-pane">
                <div class="console-wrapper">
                    <div class="console-header">
                        <span>Debug Log</span>
                        <div class="console-actions" style="display: flex; align-items: center; gap: 8px;">
                            <button id="btn-copy-debug" class="txt-btn"
                                style="color: var(--text-accent); font-weight: 600;">Copy Log</button>
                            <button id="btn-clear-debug" class="txt-btn">Clear Log</button>
                        </div>
                    </div>
                    <textarea id="debug-output" class="code-viewport" spellcheck="false" readonly
                        placeholder="// Agent debug logs (Prompts, LLM Raw Responses, and executed Tool Calls) will appear here..."
                        style="border: none; background: transparent; outline: none; resize: none; font-family: 'JetBrains Mono', monospace; font-size: 11px;"></textarea>
                </div>
            </div>
        </main>

        <!-- PERSISTED DOCK PREVIEW (IF ATTACHED) -->
        <div id="frame-attachment-preview" class="attachment-dock hidden">
            <div id="dock-thumbnails" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <!-- Thumbnails will be injected dynamically -->
            </div>
            <button id="btn-remove-attachment" class="close-badge"
                style="position: static; margin-left: auto; width: auto; height: auto; padding: 2px 6px; border-radius: var(--border-radius-sm); font-size: 9px; line-height: 1.2;">Clear
                All</button>
            <span class="dock-label" style="margin-left: 8px;">Captured frames</span>
        </div>

        <!-- QUICK CHIPS & UTILITIES -->
        <div id="active-quick-utilities" class="quick-utilities">
            <button id="chip-capture" class="chip" title="Capture the active frame from After Effects">
                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <span>Capture Frame</span>
            </button>
            <button id="chip-capture-sequence" class="chip" title="Capture a sequence of 5 frames from the composition">
                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none">
                    <rect x="2" y="2" width="20" height="20" rx="2.5" ry="2.5"></rect>
                    <line x1="7" y1="2" x2="7" y2="22"></line>
                    <line x1="17" y1="2" x2="17" y2="22"></line>
                </svg>
                <span>Capture Sequence</span>
            </button>
        </div>

        <!-- FOOTER INPUT -->
        <footer class="app-footer" style="display: flex; flex-direction: column;">
            <div class="input-glow-wrapper"
                style="display: flex; flex-direction: column; align-items: stretch; gap: 4px; position: relative;">
                <textarea id="chat-input" placeholder="Ask Arc to edit, splice, or animate..." rows="1"
                    style="width: 100%; border: none; outline: none; background: transparent; resize: none;"></textarea>
                <div id="chat-command-popup" class="command-autocomplete-popup hidden"></div>
                <div class="input-controls-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
                    <div class="input-controls-left" style="display: flex; align-items: center; gap: 6px;">
                        <button id="btn-plus" class="icon-btn" title="Add attachment" type="button">
                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5"
                                fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                        <select id="chat-model-select" class="chat-model-select-dropdown">
                            <!-- Options populated dynamically -->
                        </select>
                    </div>
                    <div class="input-controls-right">
                        <button id="btn-send" class="send-btn" disabled>
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5"
                                fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                        <button id="btn-stop" class="stop-btn hidden" title="Stop execution">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5"
                                fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <input type="file" id="file-upload-input" multiple style="display: none;">
        </footer>

        <!-- DRAWER SETTINGS PANEL -->
        <div id="settings-drawer" class="drawer hidden">
            <div class="drawer-overlay"></div>
            <div class="drawer-content">
                <div class="drawer-header">
                    <h2>API Settings</h2>
                    <button id="btn-close-settings" class="close-btn">&times;</button>
                </div>
                <div class="drawer-body">
                    <form id="form-settings">

                        <div class="field-group">
                            <label for="setting-provider">Active AI Provider</label>
                            <select id="setting-provider" class="form-input">
                                <option value="lemonade">Lemonade (Local Server)</option>
                                <option value="gemini">Google Gemini</option>
                                <option value="openai">OpenAI (ChatGPT)</option>
                                <option value="anthropic">Anthropic Claude</option>
                            </select>
                        </div>

                        <!-- Provider specific sections -->
                        <div class="provider-sections-container"
                            style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px; border-top: 1px solid var(--border-color); padding-top: 10px;">

                            <!-- Lemonade Section -->
                            <div class="provider-section" data-provider="lemonade"
                                style="border: 1px solid var(--border-color); padding: 8px; border-radius: var(--border-radius-sm); background: rgba(255,255,255,0.02);">
                                <div
                                    style="font-weight: bold; font-size: 10px; margin-bottom: 6px; text-transform: uppercase; color: var(--text-accent);">
                                    Lemonade (Local)</div>
                                <div class="field-group" style="margin-bottom: 6px;">
                                    <label for="setting-url-lemonade" style="font-size: 9px;">Base URL</label>
                                    <input type="text" id="setting-url-lemonade" class="form-input"
                                        placeholder="http://localhost:13305/v1"
                                        style="padding: 4px 8px; font-size: 10px;">
                                </div>
                                <div class="field-group" style="margin-bottom: 0;">
                                    <label for="setting-key-lemonade" style="font-size: 9px;">API Key (Optional)</label>
                                    <input type="password" id="setting-key-lemonade" class="form-input"
                                        placeholder="API access key" style="padding: 4px 8px; font-size: 10px;">
                                </div>
                            </div>

                            <!-- Gemini Section -->
                            <div class="provider-section" data-provider="gemini"
                                style="border: 1px solid var(--border-color); padding: 8px; border-radius: var(--border-radius-sm); background: rgba(255,255,255,0.02);">
                                <div
                                    style="font-weight: bold; font-size: 10px; margin-bottom: 6px; text-transform: uppercase; color: var(--text-accent);">
                                    Google Gemini</div>
                                <div class="field-group" style="margin-bottom: 6px;">
                                    <label for="setting-url-gemini" style="font-size: 9px;">Base URL</label>
                                    <input type="text" id="setting-url-gemini" class="form-input"
                                        placeholder="https://generativelanguage.googleapis.com"
                                        style="padding: 4px 8px; font-size: 10px;">
                                </div>
                                <div class="field-group" style="margin-bottom: 0;">
                                    <label for="setting-key-gemini" style="font-size: 9px;">API Key</label>
                                    <input type="password" id="setting-key-gemini" class="form-input"
                                        placeholder="API access key" style="padding: 4px 8px; font-size: 10px;">
                                </div>
                            </div>

                            <!-- OpenAI Section -->
                            <div class="provider-section" data-provider="openai"
                                style="border: 1px solid var(--border-color); padding: 8px; border-radius: var(--border-radius-sm); background: rgba(255,255,255,0.02);">
                                <div
                                    style="font-weight: bold; font-size: 10px; margin-bottom: 6px; text-transform: uppercase; color: var(--text-accent);">
                                    OpenAI (ChatGPT)</div>
                                <div class="field-group" style="margin-bottom: 6px;">
                                    <label for="setting-url-openai" style="font-size: 9px;">Base URL</label>
                                    <input type="text" id="setting-url-openai" class="form-input"
                                        placeholder="https://api.openai.com/v1"
                                        style="padding: 4px 8px; font-size: 10px;">
                                </div>
                                <div class="field-group" style="margin-bottom: 6px;">
                                    <label for="setting-key-openai" style="font-size: 9px;">API Key</label>
                                    <input type="password" id="setting-key-openai" class="form-input"
                                        placeholder="API access key" style="padding: 4px 8px; font-size: 10px;">
                                </div>
                                <div class="field-group" style="margin-bottom: 0;">
                                    <label for="setting-openai-reasoning-effort" style="font-size: 9px;">Reasoning Effort (for o1/o3-mini)</label>
                                    <select id="setting-openai-reasoning-effort" class="form-input" style="padding: 4px 8px; font-size: 10px; height: auto;">
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Anthropic Section -->
                            <div class="provider-section" data-provider="anthropic"
                                style="border: 1px solid var(--border-color); padding: 8px; border-radius: var(--border-radius-sm); background: rgba(255,255,255,0.02);">
                                <div
                                    style="font-weight: bold; font-size: 10px; margin-bottom: 6px; text-transform: uppercase; color: var(--text-accent);">
                                    Anthropic Claude</div>
                                <div class="field-group" style="margin-bottom: 6px;">
                                    <label for="setting-url-anthropic" style="font-size: 9px;">Base URL</label>
                                    <input type="text" id="setting-url-anthropic" class="form-input"
                                        placeholder="https://api.anthropic.com/v1"
                                        style="padding: 4px 8px; font-size: 10px;">
                                </div>
                                <div class="field-group" style="margin-bottom: 6px;">
                                    <label for="setting-key-anthropic" style="font-size: 9px;">API Key</label>
                                    <input type="password" id="setting-key-anthropic" class="form-input"
                                        placeholder="API access key" style="padding: 4px 8px; font-size: 10px;">
                                </div>
                                <div class="field-group" style="margin-bottom: 0;">
                                    <label for="setting-anthropic-thinking-budget" style="font-size: 9px;">Thinking Budget (Tokens, 0 to disable)</label>
                                    <input type="number" id="setting-anthropic-thinking-budget" class="form-input" min="0" max="65536"
                                        placeholder="2048" style="padding: 4px 8px; font-size: 10px;">
                                </div>
                            </div>
                        </div>

                        <div class="field-group">
                            <label for="setting-permission-mode">Agent Permission Level</label>
                            <select id="setting-permission-mode" class="form-input">
                                <option value="review">Request Review Mode (Default)</option>
                                <option value="permissive">Permissive Mode (Auto-run all)</option>
                                <option value="strict">Strict Mode (Require all permissions)</option>
                            </select>
                            <div id="setting-permission-mode-desc" style="font-size: 9px; color: var(--text-secondary); margin-top: 4px; line-height: 1.3;">
                                <!-- Populated dynamically -->
                            </div>
                        </div>

                        <div class="field-group">
                            <label for="setting-max-tool-retry">Max Tool Turns Limit</label>
                            <input type="number" id="setting-max-tool-retry" class="form-input" min="1" max="100"
                                placeholder="15">
                        </div>

                        <div class="field-group" style="display: flex; gap: 8px;">
                            <div style="flex: 1;">
                                <label for="setting-temperature">Temperature</label>
                                <input type="number" id="setting-temperature" class="form-input" min="0.0" max="2.0" step="0.05"
                                    placeholder="0.2" style="padding: 4px 8px; font-size: 10px; width: 100%; box-sizing: border-box;">
                            </div>
                            <div style="flex: 1;">
                                <label for="setting-top-p">Top-P</label>
                                <input type="number" id="setting-top-p" class="form-input" min="0.0" max="1.0" step="0.01"
                                    placeholder="0.95" style="padding: 4px 8px; font-size: 10px; width: 100%; box-sizing: border-box;">
                            </div>
                        </div>

                        <div class="field-group check-group"
                            style="display: flex; align-items: center; gap: 8px; margin-top: 8px; margin-bottom: 8px;">
                            <input type="checkbox" id="setting-include-base64"
                                style="cursor: pointer; width: 16px; height: 16px; accent-color: var(--text-accent);">
                            <label for="setting-include-base64"
                                style="margin: 0; cursor: pointer; user-select: none;">Include Base64 in Debug
                                Logs</label>
                        </div>

                        <div class="field-group check-group"
                            style="display: flex; align-items: center; gap: 8px; margin-top: 8px; margin-bottom: 8px;">
                            <input type="checkbox" id="setting-web-search"
                                style="cursor: pointer; width: 16px; height: 16px; accent-color: var(--text-accent);">
                            <label for="setting-web-search"
                                style="margin: 0; cursor: pointer; user-select: none;">Enable Web Search (DuckDuckGo)</label>
                        </div>

                        <div class="field-group check-group"
                            style="display: flex; align-items: center; gap: 8px; margin-top: 8px; margin-bottom: 8px;">
                            <input type="checkbox" id="setting-web-scrape"
                                style="cursor: pointer; width: 16px; height: 16px; accent-color: var(--text-accent);">
                            <label for="setting-web-scrape"
                                style="margin: 0; cursor: pointer; user-select: none;">Enable Web Scraping</label>
                        </div>

                        <div class="field-group check-group"
                            style="display: flex; align-items: center; gap: 8px; margin-top: 8px; margin-bottom: 8px;">
                            <input type="checkbox" id="setting-ui-transitions"
                                style="cursor: pointer; width: 16px; height: 16px; accent-color: var(--text-accent);">
                            <label for="setting-ui-transitions"
                                style="margin: 0; cursor: pointer; user-select: none;">Enable UI Animations</label>
                        </div>

                        <div class="field-group" style="margin-top: 10px;">
                            <label>Allowed Tools (Autorun)</label>
                            <div id="settings-allowed-tools-list" style="display: flex; flex-direction: column; gap: 4px; margin-top: 4px; max-height: 120px; overflow-y: auto; padding: 6px; border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); background: var(--bg-input);">
                                <!-- Populate allowed tools dynamically -->
                            </div>
                        </div>

                        <div class="field-group" style="margin-top: 10px;">
                            <label>Denied Tools (Block Run)</label>
                            <div id="settings-denied-tools-list" style="display: flex; flex-direction: column; gap: 4px; margin-top: 4px; max-height: 120px; overflow-y: auto; padding: 6px; border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); background: var(--bg-input);">
                                <!-- Populate denied tools dynamically -->
                            </div>
                        </div>

                        <div class="field-group" style="margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 10px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                                <label style="margin: 0; font-weight: 600;">Custom Agent Skills</label>
                                <button type="button" id="btn-open-skills-folder" class="txt-btn" style="color: var(--text-accent); font-weight: 600; cursor: pointer; background: transparent; border: none; font-size: 10px;">Open Folder</button>
                            </div>
                            <div id="settings-skills-list" style="display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow-y: auto; padding: 6px; border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); background: var(--bg-input);">
                                <!-- Populate skills dynamically -->
                            </div>
                        </div>

                        <div class="drawer-actions"
                            style="display: flex; flex-direction: column; gap: 8px; margin-top: 14px;">
                            <button type="submit" id="btn-save-settings" class="btn-primary">Save & Apply</button>
                            <button type="button" id="btn-inspect-comp" class="btn-secondary">Test Connection</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

        <!-- FLOATING PLAN MODAL -->
        <div id="plan-modal" class="modal">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Active Execution Plan</h2>
                    <button id="btn-close-plan" class="close-btn" style="background: none; border: none; font-size: 16px; color: var(--text-secondary); cursor: pointer; line-height: 1;">&times;</button>
                </div>
                <div id="plan-modal-body" class="modal-body"></div>
            </div>
        </div>

        <!-- Adobe CEP Library -->
    <script src="lib/CSInterface.js"></script>
    <!-- Modularized Controller components -->
    <script src="js/state.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/instructions.js"></script>
    <script src="js/reasoning-parser.js"></script>
    <script src="js/markdown-parser.js"></script>
    <script src="js/static-analyzer.js"></script>
    <script src="js/agent.js"></script>
    <script src="js/commands.js"></script>
    <!-- DRAG AND DROP OVERLAY -->
    <div id="drag-overlay" class="drag-overlay hidden">
        <div class="drag-overlay-content">
            <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="2.5" fill="none">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <span>Drop files anywhere to upload</span>
        </div>
    </div>

    <!-- Entry UI Bindings -->
    <script src="index.js"></script>

    <!-- ANNOTATION MODAL OVERLAY -->
    <div id="annotation-modal-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; display: none; background: rgba(0,0,0,0.85);">
        <button id="btn-close-annotation-modal" style="position: absolute; top: 12px; right: 12px; z-index: 10000; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color, #2b2b2b); color: var(--text-primary, #d5d5d5); border-radius: 50%; width: 24px; height: 24px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1;">&times;</button>
        <iframe id="annotation-iframe" src="" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>

    <!-- IMAGE LIGHTBOX ZOOM OVERLAY -->
    <div id="image-lightbox" class="lightbox-overlay">
        <div class="lightbox-scroller">
            <div class="lightbox-content"></div>
        </div>
        
        <button class="lightbox-close" aria-label="Close image viewer" style="position: absolute; top: 20px; right: 20px; z-index: 10001;">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        
        <!-- Floating Zoom Controls in Lightbox -->
        <div class="lightbox-zoom-bar" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.6); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); z-index: 10001; user-select: none;">
            <button id="btn-lightbox-zoom-out" class="lightbox-zoom-btn" title="Zoom Out (Ctrl+Scroll Down)" style="background: transparent; border: none; color: #d5d5d5; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 2px;">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
            </button>
            <span id="lightbox-zoom-level" style="font-family: monospace; font-size: 11px; min-width: 35px; text-align: center; color: #d5d5d5;">100%</span>
            <button id="btn-lightbox-zoom-in" class="lightbox-zoom-btn" title="Zoom In (Ctrl+Scroll Up)" style="background: transparent; border: none; color: #d5d5d5; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 2px;">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                    <line x1="11" y1="8" x2="11" y2="14"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
            </button>
            <div style="width: 1px; height: 12px; background: rgba(255, 255, 255, 0.2); margin: 0 4px;"></div>
            <button id="btn-lightbox-zoom-reset" class="lightbox-zoom-btn" title="Reset Zoom (Double click background also resets)" style="background: transparent; border: none; color: #d5d5d5; cursor: pointer; font-size: 10px; display: flex; align-items: center;">Reset</button>
        </div>
    </div>
    
    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="toast-container"></div>
</body>
