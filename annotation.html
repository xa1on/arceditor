<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annotate Frame - ArcEditor</title>
    <!-- JetBrains Mono Font -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #1c1c1c;
            --bg-surface: #232323;
            --bg-input: #141414;
            --border-color: #2b2b2b;
            --border-focus: #4f4f4f;
            --bg-tab-hover: #353535;
            --bg-tab-active: #3e3e3e;
            --text-primary: #d5d5d5;
            --text-secondary: #8e8e8e;
            --text-accent: #1473e6;
            --text-error: #ff4444;
            --text-success: #00c851;
            --font-sans: "Adobe Clean", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', Consolas, monospace;
            --border-radius: 3px;
            --border-radius-sm: 3px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 11px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* HEADER & TOOLBAR */
        header {
            background-color: var(--bg-surface);
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 12px;
            font-weight: 500;
        }

        .toolbar {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            font-family: var(--font-sans);
            font-size: 10px;
            font-weight: 400;
            padding: 4px 8px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tool-btn:hover {
            color: var(--text-primary);
            background-color: var(--bg-tab-hover);
        }

        .tool-btn.active {
            background-color: var(--bg-tab-active);
            color: var(--text-primary);
            border-color: var(--border-focus);
        }

        .tool-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        .tool-divider {
            width: 1px;
            height: 14px;
            background-color: var(--border-color);
            margin: 0 4px;
        }

        .color-palette {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .color-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid transparent;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .color-btn:hover {
            transform: scale(1.15);
        }

        .color-btn.active {
            border-color: var(--text-primary);
            transform: scale(1.15);
        }

        .action-btn {
            padding: 5px 12px;
            font-size: 10px;
            font-weight: 400;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            font-family: var(--font-sans);
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--text-accent);
            color: white;
        }

        .btn-primary:hover {
            background-color: #2e8dff;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            background-color: var(--bg-tab-hover);
            border-color: var(--border-focus);
        }

        .tool-spacer {
            margin-left: auto;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* WORKSPACE CANVAS */
        .workspace {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: #141414;
            scrollbar-width: thin;
            scrollbar-color: #3a3a3a var(--bg-input);
        }

        .workspace::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .workspace::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 0;
        }

        .workspace::-webkit-scrollbar-track {
            background: var(--bg-input);
        }

        .canvas-wrapper {
            position: relative;
            border: 1px solid var(--border-color);
            overflow: hidden;
            background-color: black;
            max-width: 100%;
            max-height: calc(100vh - 120px);
            transform-origin: 0 0;
            transition: none !important;
            flex-shrink: 0;
        }

        #preview-image {
            display: block;
            max-width: 100%;
            max-height: calc(100vh - 120px);
            object-fit: contain;
            pointer-events: none;
        }

        #drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        #drawing-canvas.tool-select {
            cursor: default;
        }

        /* INLINE LABEL POPOVER */
        .label-popover {
            position: absolute;
            background: var(--bg-surface);
            border: 1px solid var(--border-focus);
            border-radius: var(--border-radius-sm);
            padding: 4px;
            display: flex;
            gap: 4px;
            z-index: 1000;
        }

        .label-popover input {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 10px;
            padding: 4px 6px;
            outline: none;
            border-radius: 2px;
            width: 150px;
        }

        .label-popover input:focus {
            border-color: var(--text-accent);
        }

        .label-popover button {
            background: var(--text-accent);
            border: none;
            color: white;
            font-family: var(--font-sans);
            font-size: 9px;
            padding: 4px 8px;
            border-radius: 2px;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        /* FOOTER ACTIONS */
        footer {
            background-color: var(--bg-surface);
            padding: 10px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 6px;
        }
    </style>
</head>
<body>

    <!-- HEADER TITLE -->
    <header>
        <h1 id="window-title">Annotate Frame</h1>
        <div id="file-info" style="font-size: 10px; color: var(--text-secondary);">Loading item...</div>
    </header>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <button id="tool-select" class="tool-btn active" title="Select and delete shapes">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none">
                <polygon points="3 3 3 16 8 12 13 21 16 19 11 11 18 11 3 3"></polygon>
            </svg>
            <span>Select</span>
        </button>
        <button id="tool-rect" class="tool-btn" title="Draw bounding box">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            </svg>
            <span>Box</span>
        </button>
        <button id="tool-circle" class="tool-btn" title="Draw circle/ellipse">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none">
                <circle cx="12" cy="12" r="9"></circle>
            </svg>
            <span>Circle</span>
        </button>
        <button id="tool-arrow" class="tool-btn" title="Draw motion path vector">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none">
                <line x1="5" y1="19" x2="19" y2="5"></line>
                <polyline points="12 5 19 5 19 12"></polyline>
            </svg>
            <span>Arrow</span>
        </button>
        <button id="tool-brush" class="tool-btn" title="Draw sketch path">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none">
                <path d="M18 2L22 6L9 19H5v-4L18 2z"></path>
            </svg>
            <span>Sketch</span>
        </button>
        <button id="tool-text" class="tool-btn" title="Place text note">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none">
                <polyline points="4 7 4 4 20 4 20 7"></polyline>
                <line x1="9" y1="20" x2="15" y2="20"></line>
                <line x1="12" y1="4" x2="12" y2="20"></line>
            </svg>
            <span>Text</span>
        </button>

        <div class="tool-divider"></div>

        <!-- COLORS -->
        <div class="color-palette">
            <button class="color-btn active" style="background-color: #ff4d4d;" data-color="#ff4d4d"></button>
            <button class="color-btn" style="background-color: #00f0ff;" data-color="#00f0ff"></button>
            <button class="color-btn" style="background-color: #ffd700;" data-color="#ffd700"></button>
            <button class="color-btn" style="background-color: #39ff14;" data-color="#39ff14"></button>
            
            <div class="tool-divider" style="height: 14px; margin: 0 2px;"></div>
            
            <!-- Custom Color Picker -->
            <div id="custom-color-wrap" style="position: relative; width: 18px; height: 18px; border-radius: 50%; overflow: hidden; border: 2px solid var(--border-color); cursor: pointer; background: linear-gradient(45deg, red, orange, yellow, green, blue, purple); transition: transform 0.15s ease;">
                <input type="color" id="custom-color-picker" value="#9d00ff" style="position: absolute; top: -6px; left: -6px; width: 30px; height: 30px; border: none; cursor: pointer; background: none; padding: 0; opacity: 0;" />
            </div>
        </div>

        <div class="tool-divider"></div>

        <!-- SELECTION EDITING -->
        <button id="btn-delete-shape" class="tool-btn" style="color: var(--text-error); border-color: rgba(255, 77, 77, 0.2);" title="Delete selected shape" disabled>
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Delete Selected</span>
        </button>

        <div class="tool-divider"></div>

        <!-- UNDO / REDO -->
        <button id="btn-undo" class="tool-btn" title="Undo (Ctrl+Z)" disabled>
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none">
                <path d="M3 7v6h6"></path>
                <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
            </svg>
            <span>Undo</span>
        </button>
        <button id="btn-redo" class="tool-btn" title="Redo (Ctrl+Y)" disabled>
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none">
                <path d="M21 7v6h-6"></path>
                <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
            </svg>
            <span>Redo</span>
        </button>

        <div class="tool-divider"></div>

        <button id="btn-zoom-out" class="tool-btn" title="Zoom Out (Scroll Down)">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
        </button>
        <span id="zoom-level" style="font-family: var(--font-mono); font-size: 10px; min-width: 32px; text-align: center; color: var(--text-secondary); user-select: none;">100%</span>
        <button id="btn-zoom-in" class="tool-btn" title="Zoom In (Scroll Up)">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
                <line x1="11" y1="8" x2="11" y2="14"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
        </button>
        <button id="btn-zoom-reset" class="tool-btn" title="Reset Zoom (Double click empty space also resets)">
            <span>Reset</span>
        </button>

        <div class="tool-spacer"></div>

        <button id="btn-clear-all" class="tool-btn" style="color: var(--text-secondary);" title="Clear all annotations">
            <span>Clear All</span>
        </button>
    </div>

    <!-- WORKSPACE DRAWING BOARD -->
    <div class="workspace">
        <div class="canvas-wrapper" id="canvas-wrapper">
            <img id="preview-image" src="" alt="Frame Source" />
            <canvas id="drawing-canvas"></canvas>
            
            <!-- FLOATING INPUT POPOVER -->
            <div id="label-popover" class="label-popover hidden">
                <input type="text" id="label-input" placeholder="Enter shape label..." spellcheck="false" />
                <button id="btn-submit-label">OK</button>
                <button id="btn-cancel-label" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); margin-left: 4px; border-radius: 2px; padding: 4px 8px; cursor: pointer; font-family: var(--font-mono); font-size: 10px;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- FOOTER ACTIONS -->
    <footer>
        <button id="btn-cancel" class="action-btn btn-secondary">Discard</button>
        <button id="btn-apply" class="action-btn btn-primary">Apply Annotations</button>
    </footer>

    <script>
        (function() {
            let index = null;
            let originalAnnotations = [];
            let shapes = [];
            let activeTool = 'select'; // 'select', 'rect', 'circle', 'arrow', 'brush', 'text'
            let activeColor = '#ff4d4d'; // Red default
            let selectedShapeIdx = -1;
            let hoveredShapeIdx = -1;
            let isDrawing = false;
            let isDragging = false;
            let dragMode = null; // 'move', 'resize-tl', etc.
            let dragStartMouseX = 0;
            let dragStartMouseY = 0;
            let dragStartShape = null; // clone of selected shape
            let startX = 0, startY = 0;
            let currentX = 0, currentY = 0;
            let isDirty = false;
            let isSaved = false;

            // Floating Input States
            let pendingShape = null;

            // Undo & Redo History Stacks
            let undoStack = [];
            let redoStack = [];
            
            let dpr = window.devicePixelRatio || 1;

            // Zoom & Pan States
            let zoom = 1.0;
            let baseWidth = 0;
            let baseHeight = 0;
            let isPanning = false;
            let panStartMouseX = 0;
            let panStartMouseY = 0;
            let panStartScrollLeft = 0;
            let panStartScrollTop = 0;

            const img = document.getElementById("preview-image");
            const canvas = document.getElementById("drawing-canvas");
            const ctx = canvas.getContext("2d");
            const wrapper = document.getElementById("canvas-wrapper");
            const popover = document.getElementById("label-popover");
            const popoverInput = document.getElementById("label-input");
            const btnDelete = document.getElementById("btn-delete-shape");
            const btnUndo = document.getElementById("btn-undo");
            const btnRedo = document.getElementById("btn-redo");

            function cloneShapes(shapesArray) {
                return shapesArray.map(s => {
                    const clone = { ...s };
                    if (s.points) {
                        clone.points = s.points.map(p => ({ ...p }));
                    }
                    return clone;
                });
            }

            function saveState() {
                undoStack.push(cloneShapes(shapes));
                redoStack = [];
                updateUndoRedoButtons();
            }

            function undo() {
                if (undoStack.length === 0) return;
                redoStack.push(cloneShapes(shapes));
                shapes = undoStack.pop();
                isDirty = true;
                selectShapeIdx(-1);
                updateUndoRedoButtons();
                redraw();
            }

            function redo() {
                if (redoStack.length === 0) return;
                undoStack.push(cloneShapes(shapes));
                shapes = redoStack.pop();
                isDirty = true;
                selectShapeIdx(-1);
                updateUndoRedoButtons();
                redraw();
            }

            function updateUndoRedoButtons() {
                if (btnUndo) btnUndo.disabled = (undoStack.length === 0);
                if (btnRedo) btnRedo.disabled = (redoStack.length === 0);
            }

            // Initialization
            window.addEventListener("DOMContentLoaded", () => {
                const parentWin = window.opener || window.parent;
                if (parentWin && parentWin.currentAnnotationData) {
                    const data = parentWin.currentAnnotationData;
                    index = data.index;
                    originalAnnotations = data.annotations || [];
                    shapes = cloneShapes(originalAnnotations);

                    const titleEl = document.getElementById("window-title");
                    const fileInfo = document.getElementById("file-info");

                    if (data.frameNumber !== undefined && data.frameNumber !== null) {
                        titleEl.innerText = `Annotate Frame - Frame ${data.frameNumber} (${data.timeInSeconds.toFixed(3)}s)`;
                    } else {
                        titleEl.innerText = `Annotate Image`;
                    }
                    fileInfo.innerText = data.name || "composition_frame.png";

                    img.src = `data:${data.mimeType || 'image/png'};base64,${data.base64Data}`;
                    img.onload = () => {
                        baseWidth = img.clientWidth;
                        baseHeight = img.clientHeight;
                        
                        img.style.maxWidth = "none";
                        img.style.maxHeight = "none";
                        wrapper.style.maxWidth = "none";
                        wrapper.style.maxHeight = "none";
                        
                        wrapper.style.width = baseWidth + "px";
                        wrapper.style.height = baseHeight + "px";
                        img.style.width = baseWidth + "px";
                        img.style.height = baseHeight + "px";
                        
                        resizeCanvas();
                    };
                } else {
                    document.getElementById("file-info").innerText = "No image context loaded (stand-alone mockup mode).";
                    img.style.display = "none";
                    baseWidth = 600;
                    baseHeight = 400;
                    wrapper.style.width = baseWidth + "px";
                    wrapper.style.height = baseHeight + "px";
                    resizeCanvas();
                }
            });

            window.addEventListener("resize", () => {
                if (baseWidth === 0 && img.style.display !== "none") {
                    baseWidth = img.clientWidth;
                    baseHeight = img.clientHeight;
                }
                resizeCanvas();
            });

            function resizeCanvas() {
                if (baseWidth > 0) {
                    const w = baseWidth * zoom;
                    const h = baseHeight * zoom;
                    dpr = window.devicePixelRatio || 1;
                    
                    canvas.width = w * dpr;
                    canvas.height = h * dpr;
                    canvas.style.width = w + "px";
                    canvas.style.height = h + "px";
                    canvas.style.top = "0px";
                    canvas.style.left = "0px";
                    
                    ctx.restore();
                    ctx.save();
                    ctx.scale(dpr, dpr);

                    // Adjust workspace flex alignment dynamically based on overflow
                    const workRect = workspace.getBoundingClientRect();
                    // 40px is padding offset (20px each side)
                    if (w > workRect.width - 40) {
                        workspace.style.justifyContent = "flex-start";
                    } else {
                        workspace.style.justifyContent = "center";
                    }
                    if (h > workRect.height - 40) {
                        workspace.style.alignItems = "flex-start";
                    } else {
                        workspace.style.alignItems = "center";
                    }
                }
                redraw();
            }

            // TOOL SWITCHING
            const toolButtons = {
                'select': document.getElementById("tool-select"),
                'rect': document.getElementById("tool-rect"),
                'circle': document.getElementById("tool-circle"),
                'arrow': document.getElementById("tool-arrow"),
                'brush': document.getElementById("tool-brush"),
                'text': document.getElementById("tool-text")
            };

            Object.keys(toolButtons).forEach(tool => {
                toolButtons[tool].addEventListener("click", () => {
                    setActiveTool(tool);
                });
            });

            function setActiveTool(tool) {
                activeTool = tool;
                Object.keys(toolButtons).forEach(t => {
                    toolButtons[t].classList.toggle("active", t === tool);
                });

                canvas.className = `tool-${tool}`;
                hidePopover();

                if (tool !== 'select') {
                    selectShapeIdx(-1);
                }
                redraw();
            }

            // COLORS SELECTOR
            const colorBtns = document.querySelectorAll(".color-btn");
            const customColorPicker = document.getElementById("custom-color-picker");
            const customColorWrap = document.getElementById("custom-color-wrap");

            colorBtns.forEach(btn => {
                btn.addEventListener("click", (e) => {
                    colorBtns.forEach(b => b.classList.remove("active"));
                    if (customColorWrap) {
                        customColorWrap.classList.remove("active");
                        customColorWrap.style.borderColor = "var(--border-color)";
                        customColorWrap.style.background = "linear-gradient(45deg, red, orange, yellow, green, blue, purple)";
                    }
                    btn.classList.add("active");
                    activeColor = btn.getAttribute("data-color");
                    
                    if (activeTool === 'select' && selectedShapeIdx !== -1) {
                        saveState();
                        shapes[selectedShapeIdx].color = activeColor;
                        isDirty = true;
                        redraw();
                    }
                });
            });

            if (customColorPicker && customColorWrap) {
                customColorPicker.addEventListener("input", (e) => {
                    colorBtns.forEach(b => b.classList.remove("active"));
                    customColorWrap.classList.add("active");
                    customColorWrap.style.borderColor = "var(--text-primary)";
                    activeColor = e.target.value;
                    customColorWrap.style.background = activeColor;
                    
                    if (activeTool === 'select' && selectedShapeIdx !== -1) {
                        saveState();
                        shapes[selectedShapeIdx].color = activeColor;
                        isDirty = true;
                        redraw();
                    }
                });
            }

            // HIT-TESTING & HELPER FUNCTIONS
            function getShapeBounds(shape, w, h) {
                if (shape.type === 'rect' || shape.type === 'circle' || shape.type === 'arrow') {
                    const xMin = Math.min(shape.x1, shape.x2) * w;
                    const yMin = Math.min(shape.y1, shape.y2) * h;
                    const xMax = Math.max(shape.x1, shape.x2) * w;
                    const yMax = Math.max(shape.y1, shape.y2) * h;
                    return { x: xMin, y: yMin, w: xMax - xMin, h: yMax - yMin };
                } else if (shape.type === 'path') {
                    let xMin = 1.0, yMin = 1.0, xMax = 0.0, yMax = 0.0;
                    shape.points.forEach(p => {
                        if (p.x < xMin) xMin = p.x;
                        if (p.y < yMin) yMin = p.y;
                        if (p.x > xMax) xMax = p.x;
                        if (p.y > yMax) yMax = p.y;
                    });
                    return { x: xMin * w, y: yMin * h, w: (xMax - xMin) * w, h: (yMax - yMin) * h };
                } else if (shape.type === 'text') {
                    const tx = shape.x1 * w;
                    const ty = shape.y1 * h;
                    ctx.font = "bold 11px 'JetBrains Mono', monospace";
                    const textW = ctx.measureText(shape.text || "").width;
                    return { x: tx - 4, y: ty - 13, w: textW + 8, h: 17 };
                }
                return { x: 0, y: 0, w: 0, h: 0 };
            }

            function getHandles(shape, w, h) {
                if (shape.type === 'rect' || shape.type === 'circle') {
                    const px1 = shape.x1 * w;
                    const py1 = shape.y1 * h;
                    const px2 = shape.x2 * w;
                    const py2 = shape.y2 * h;
                    const pmx = (px1 + px2) / 2;
                    const pmy = (py1 + py2) / 2;
                    return [
                        { name: 'tl', x: px1, y: py1, cursor: 'nwse-resize' },
                        { name: 'tr', x: px2, y: py1, cursor: 'nesw-resize' },
                        { name: 'bl', x: px1, y: py2, cursor: 'nesw-resize' },
                        { name: 'br', x: px2, y: py2, cursor: 'nwse-resize' },
                        { name: 't', x: pmx, y: py1, cursor: 'ns-resize' },
                        { name: 'b', x: pmx, y: py2, cursor: 'ns-resize' },
                        { name: 'l', x: px1, y: pmy, cursor: 'ew-resize' },
                        { name: 'r', x: px2, y: pmy, cursor: 'ew-resize' }
                    ];
                } else if (shape.type === 'arrow') {
                    return [
                        { name: 'start', x: shape.x1 * w, y: shape.y1 * h, cursor: 'move' },
                        { name: 'end', x: shape.x2 * w, y: shape.y2 * h, cursor: 'move' }
                    ];
                }
                return [];
            }

            function getHandleAt(x, y, shape, w, h) {
                const handles = getHandles(shape, w, h);
                const tolerance = 6;
                for (const hd of handles) {
                    if (Math.hypot(x - hd.x, y - hd.y) <= tolerance) {
                        return hd;
                    }
                }
                return null;
            }

            function getShapeAt(x, y) {
                const w = canvas.width / dpr;
                const h = canvas.height / dpr;
                for (let i = shapes.length - 1; i >= 0; i--) {
                    const shape = shapes[i];
                    const bounds = getShapeBounds(shape, w, h);
                    if (shape.type === 'rect') {
                        const tol = 8;
                        if (x >= bounds.x - tol && x <= bounds.x + bounds.w + tol &&
                            y >= bounds.y - tol && y <= bounds.y + bounds.h + tol) {
                            return i;
                        }
                    } else if (shape.type === 'circle') {
                        const cx = bounds.x + bounds.w / 2;
                        const cy = bounds.y + bounds.h / 2;
                        const rx = bounds.w / 2;
                        const ry = bounds.h / 2;
                        if (rx > 0 && ry > 0) {
                            const dist = Math.pow((x - cx) / (rx + 8), 2) + Math.pow((y - cy) / (ry + 8), 2);
                            if (dist <= 1) return i;
                        }
                    } else if (shape.type === 'arrow') {
                        const dist = distToSegment(x, y, shape.x1 * w, shape.y1 * h, shape.x2 * w, shape.y2 * h);
                        if (dist < 10) return i;
                    } else if (shape.type === 'path') {
                        const p = shape.points;
                        for (let j = 0; j < p.length - 1; j++) {
                            const dist = distToSegment(x, y, p[j].x * w, p[j].y * h, p[j+1].x * w, p[j+1].y * h);
                            if (dist < 10) return i;
                        }
                    } else if (shape.type === 'text') {
                        if (x >= bounds.x && x <= bounds.x + bounds.w &&
                            y >= bounds.y && y <= bounds.y + bounds.h) {
                            return i;
                        }
                    }
                }
                return -1;
            }

            function distToSegment(x, y, x1, y1, x2, y2) {
                const A = x - x1;
                const B = y - y1;
                const C = x2 - x1;
                const D = y2 - y1;

                const dot = A * C + B * D;
                const lenSq = C * C + D * D;
                let param = -1;
                if (lenSq !== 0) param = dot / lenSq;

                let xx, yy;
                if (param < 0) {
                    xx = x1;
                    yy = y1;
                } else if (param > 1) {
                    xx = x2;
                    yy = y2;
                } else {
                    xx = x1 + param * C;
                    yy = y1 + param * D;
                }

                return Math.hypot(x - xx, y - yy);
            }

            function normalizeShape(shape) {
                if (shape.type === 'rect' || shape.type === 'circle') {
                    const xMin = Math.min(shape.x1, shape.x2);
                    const yMin = Math.min(shape.y1, shape.y2);
                    const xMax = Math.max(shape.x1, shape.x2);
                    const yMax = Math.max(shape.y1, shape.y2);
                    shape.x1 = xMin;
                    shape.y1 = yMin;
                    shape.x2 = xMax;
                    shape.y2 = yMax;
                }
            }

            function selectShapeIdx(idx) {
                selectedShapeIdx = idx;
                btnDelete.disabled = (idx === -1);
                if (idx !== -1) {
                    activeColor = shapes[idx].color || '#ff4d4d';
                    colorBtns.forEach(btn => {
                        const c = btn.getAttribute("data-color");
                        btn.classList.toggle("active", c === activeColor);
                    });
                }
            }

            // SHAPE REDRAW LOGIC
            function redraw() {
                const w = canvas.width / dpr;
                const h = canvas.height / dpr;
                ctx.clearRect(0, 0, w, h);

                shapes.forEach((shape, idx) => {
                    ctx.strokeStyle = shape.color || '#ff4d4d';
                    ctx.fillStyle = shape.color || '#ff4d4d';
                    ctx.lineWidth = 2.5;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.setLineDash([]); // All shapes drawn solid

                    if (shape.type === 'rect') {
                        const sx = shape.x1 * w;
                        const sy = shape.y1 * h;
                        const sw = (shape.x2 - shape.x1) * w;
                        const sh = (shape.y2 - shape.y1) * h;
                        
                        ctx.strokeRect(sx, sy, sw, sh);

                        if (shape.label) {
                            ctx.font = "bold 10px 'JetBrains Mono', monospace";
                            const textW = ctx.measureText(shape.label).width;
                            ctx.fillStyle = "rgba(0,0,0,0.75)";
                            ctx.fillRect(sx, sy - 16, textW + 10, 16);
                            
                            ctx.fillStyle = shape.color;
                            ctx.fillText(shape.label, sx + 5, sy - 4);
                        }
                    } else if (shape.type === 'circle') {
                        const cx = (shape.x1 + shape.x2) / 2 * w;
                        const cy = (shape.y1 + shape.y2) / 2 * h;
                        const rx = Math.abs(shape.x2 - shape.x1) / 2 * w;
                        const ry = Math.abs(shape.y2 - shape.y1) / 2 * h;
                        
                        ctx.beginPath();
                        ctx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI);
                        ctx.stroke();

                        if (shape.label) {
                            const sx = Math.min(shape.x1, shape.x2) * w;
                            const sy = Math.min(shape.y1, shape.y2) * h;
                            ctx.font = "bold 10px 'JetBrains Mono', monospace";
                            const textW = ctx.measureText(shape.label).width;
                            ctx.fillStyle = "rgba(0,0,0,0.75)";
                            ctx.fillRect(sx, sy - 16, textW + 10, 16);
                            
                            ctx.fillStyle = shape.color;
                            ctx.fillText(shape.label, sx + 5, sy - 4);
                        }
                    } else if (shape.type === 'arrow') {
                        const x1 = shape.x1 * w;
                        const y1 = shape.y1 * h;
                        const x2 = shape.x2 * w;
                        const y2 = shape.y2 * h;

                        drawArrowLine(x1, y1, x2, y2);

                        if (shape.label) {
                            ctx.font = "bold 10px 'JetBrains Mono', monospace";
                            const textW = ctx.measureText(shape.label).width;
                            ctx.fillStyle = "rgba(0,0,0,0.75)";
                            ctx.fillRect(x1, y1 - 16, textW + 10, 16);
                            
                            ctx.fillStyle = shape.color;
                            ctx.fillText(shape.label, x1 + 5, y1 - 4);
                        }
                    } else if (shape.type === 'path') {
                        const p = shape.points;
                        if (p.length > 1) {
                            ctx.beginPath();
                            ctx.moveTo(p[0].x * w, p[0].y * h);
                            for (let j = 1; j < p.length; j++) {
                                ctx.lineTo(p[j].x * w, p[j].y * h);
                            }
                            ctx.stroke();
                        }
                    } else if (shape.type === 'text') {
                        const x = shape.x1 * w;
                        const y = shape.y1 * h;

                        ctx.font = "bold 11px 'JetBrains Mono', monospace";
                        const textW = ctx.measureText(shape.text || "").width;
                        ctx.fillStyle = "rgba(0,0,0,0.85)";
                        ctx.fillRect(x - 4, y - 13, textW + 8, 17);
                        
                        ctx.fillStyle = shape.color;
                        ctx.fillText(shape.text || "", x, y);
                    }
                });

                // Draw pending shape (while inputting label)
                if (pendingShape && !isDrawing) {
                    ctx.strokeStyle = pendingShape.color || activeColor;
                    ctx.fillStyle = pendingShape.color || activeColor;
                    ctx.lineWidth = 2.5;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.setLineDash([4, 4]);

                    if (pendingShape.type === 'rect') {
                        const sx = pendingShape.x1 * w;
                        const sy = pendingShape.y1 * h;
                        const sw = (pendingShape.x2 - pendingShape.x1) * w;
                        const sh = (pendingShape.y2 - pendingShape.y1) * h;
                        ctx.strokeRect(sx, sy, sw, sh);
                    } else if (pendingShape.type === 'circle') {
                        const cx = (pendingShape.x1 + pendingShape.x2) / 2 * w;
                        const cy = (pendingShape.y1 + pendingShape.y2) / 2 * h;
                        const rx = Math.abs(pendingShape.x2 - pendingShape.x1) / 2 * w;
                        const ry = Math.abs(pendingShape.y2 - pendingShape.y1) / 2 * h;
                        ctx.beginPath();
                        ctx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI);
                        ctx.stroke();
                    } else if (pendingShape.type === 'arrow') {
                        drawArrowLine(pendingShape.x1 * w, pendingShape.y1 * h, pendingShape.x2 * w, pendingShape.y2 * h);
                    } else if (pendingShape.type === 'text') {
                        const x = pendingShape.x1 * w;
                        const y = pendingShape.y1 * h;
                        ctx.font = "bold 11px 'JetBrains Mono', monospace";
                        ctx.fillStyle = "rgba(0,0,0,0.85)";
                        ctx.fillRect(x - 4, y - 13, 30, 17); // Placeholder box while typing
                    }
                    ctx.setLineDash([]);
                }

                // Draw temporary preview when drawing active tool
                if (isDrawing && (activeTool === 'rect' || activeTool === 'circle' || activeTool === 'arrow' || activeTool === 'brush')) {
                    ctx.strokeStyle = activeColor;
                    ctx.lineWidth = 2.0;
                    ctx.setLineDash([5, 3]);

                    if (activeTool === 'rect') {
                        ctx.strokeRect(startX, startY, currentX - startX, currentY - startY);
                    } else if (activeTool === 'circle') {
                        const cx = (startX + currentX) / 2;
                        const cy = (startY + currentY) / 2;
                        const rx = Math.abs(currentX - startX) / 2;
                        const ry = Math.abs(currentY - startY) / 2;
                        ctx.beginPath();
                        ctx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI);
                        ctx.stroke();
                    } else if (activeTool === 'arrow') {
                        drawArrowLine(startX, startY, currentX, currentY);
                    } else if (activeTool === 'brush' && pendingShape) {
                        ctx.setLineDash([]);
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        ctx.lineWidth = 2.5;
                        const p = pendingShape.points;
                        if (p.length > 1) {
                            ctx.beginPath();
                            ctx.moveTo(p[0].x * w, p[0].y * h);
                            for (let j = 1; j < p.length; j++) {
                                ctx.lineTo(p[j].x * w, p[j].y * h);
                            }
                            ctx.stroke();
                        }
                    }
                    ctx.setLineDash([]);
                }

                // Draw selection highlight bounding box & control handles (on top)
                if (activeTool === 'select') {
                    if (hoveredShapeIdx !== -1 && hoveredShapeIdx !== selectedShapeIdx) {
                        const shape = shapes[hoveredShapeIdx];
                        const bounds = getShapeBounds(shape, w, h);
                        ctx.strokeStyle = shape.color || '#ff4d4d';
                        ctx.lineWidth = 1.0;
                        ctx.setLineDash([3, 3]);
                        ctx.strokeRect(bounds.x - 2, bounds.y - 2, bounds.w + 4, bounds.h + 4);
                        ctx.setLineDash([]);
                    }

                    if (selectedShapeIdx !== -1) {
                        const shape = shapes[selectedShapeIdx];
                        const bounds = getShapeBounds(shape, w, h);
                        ctx.strokeStyle = shape.color || '#ff4d4d';
                        ctx.lineWidth = 1.25;
                        ctx.setLineDash([4, 4]);
                        ctx.strokeRect(bounds.x - 2, bounds.y - 2, bounds.w + 4, bounds.h + 4);
                        ctx.setLineDash([]);

                        // Draw handle nodes
                        const handles = getHandles(shape, w, h);
                        handles.forEach(handle => {
                            ctx.fillStyle = '#ffffff';
                            ctx.strokeStyle = shape.color || '#ff4d4d';
                            ctx.lineWidth = 1.5;
                            ctx.beginPath();
                            ctx.arc(handle.x, handle.y, 4.5, 0, 2 * Math.PI);
                            ctx.fill();
                            ctx.stroke();
                        });
                    }
                }
            }

            function drawArrowLine(x1, y1, x2, y2) {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                const angle = Math.atan2(y2 - y1, x2 - x1);
                const headLength = 12;

                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - headLength * Math.cos(angle - Math.PI / 6), y2 - headLength * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(x2 - headLength * Math.cos(angle + Math.PI / 6), y2 - headLength * Math.sin(angle + Math.PI / 6));
                ctx.closePath();
                ctx.fill();
            }

            // CANVAS POINTER EVENTS
            canvas.addEventListener("pointerdown", (e) => {
                if (e.button !== 0) return; // Only draw/select on left click
                canvas.setPointerCapture(e.pointerId);
                const rect = canvas.getBoundingClientRect();
                const mouseX = rect.width ? Math.max(0, Math.min(canvas.width / dpr, ((e.clientX - rect.left) / rect.width) * (canvas.width / dpr))) : 0;
                const mouseY = rect.height ? Math.max(0, Math.min(canvas.height / dpr, ((e.clientY - rect.top) / rect.height) * (canvas.height / dpr))) : 0;

                if (!popover.classList.contains("hidden")) {
                    hidePopover();
                    redraw();
                    return;
                }

                if (activeTool === 'select') {
                    const w = canvas.width / dpr;
                    const h = canvas.height / dpr;

                    // 1. Check handles first
                    if (selectedShapeIdx !== -1) {
                        const shape = shapes[selectedShapeIdx];
                        const handle = getHandleAt(mouseX, mouseY, shape, w, h);
                        if (handle) {
                            dragMode = 'resize-' + handle.name;
                            dragStartMouseX = mouseX;
                            dragStartMouseY = mouseY;
                            dragStartShape = JSON.parse(JSON.stringify(shape));
                            isDragging = true;
                            saveState();
                            return;
                        }
                    }

                    // 2. Check shape body
                    const clickedIdx = getShapeAt(mouseX, mouseY);
                    if (clickedIdx !== -1) {
                        selectShapeIdx(clickedIdx);
                        dragMode = 'move';
                        dragStartMouseX = mouseX;
                        dragStartMouseY = mouseY;
                        dragStartShape = JSON.parse(JSON.stringify(shapes[clickedIdx]));
                        isDragging = true;
                        saveState();
                    } else {
                        selectShapeIdx(-1);
                    }
                    redraw();
                    return;
                }

                isDrawing = true;
                startX = mouseX;
                startY = mouseY;
                currentX = mouseX;
                currentY = mouseY;

                if (activeTool === 'brush') {
                    const w = canvas.width / dpr;
                    const h = canvas.height / dpr;
                    pendingShape = {
                        type: 'path',
                        points: [{x: mouseX / w, y: mouseY / h}],
                        color: activeColor
                    };
                }
            });

            canvas.addEventListener("pointermove", (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = rect.width ? Math.max(0, Math.min(canvas.width / dpr, ((e.clientX - rect.left) / rect.width) * (canvas.width / dpr))) : 0;
                const mouseY = rect.height ? Math.max(0, Math.min(canvas.height / dpr, ((e.clientY - rect.top) / rect.height) * (canvas.height / dpr))) : 0;

                if (isDrawing) {
                    currentX = mouseX;
                    currentY = mouseY;

                    if (activeTool === 'brush' && pendingShape) {
                        const w = canvas.width / dpr;
                        const h = canvas.height / dpr;
                        pendingShape.points.push({x: currentX / w, y: currentY / h});
                    }
                    redraw();
                    return;
                }

                if (isDragging && activeTool === 'select' && selectedShapeIdx !== -1) {
                    const w = canvas.width / dpr;
                    const h = canvas.height / dpr;
                    const dx = (mouseX - dragStartMouseX) / w;
                    const dy = (mouseY - dragStartMouseY) / h;

                    const shape = shapes[selectedShapeIdx];
                    if (dragMode === 'move') {
                        if (shape.type === 'path') {
                            shape.points = dragStartShape.points.map(p => ({
                                x: Math.max(0, Math.min(1, p.x + dx)),
                                y: Math.max(0, Math.min(1, p.y + dy))
                            }));
                        } else {
                            shape.x1 = Math.max(0, Math.min(1, dragStartShape.x1 + dx));
                            shape.y1 = Math.max(0, Math.min(1, dragStartShape.y1 + dy));
                            shape.x2 = Math.max(0, Math.min(1, dragStartShape.x2 + dx));
                            shape.y2 = Math.max(0, Math.min(1, dragStartShape.y2 + dy));
                        }
                    } else if (dragMode.startsWith('resize-')) {
                        const handleName = dragMode.substring(7);
                        if (shape.type === 'rect' || shape.type === 'circle') {
                            if (handleName.includes('l')) shape.x1 = Math.max(0, Math.min(1, dragStartShape.x1 + dx));
                            if (handleName.includes('r')) shape.x2 = Math.max(0, Math.min(1, dragStartShape.x2 + dx));
                            if (handleName.includes('t')) shape.y1 = Math.max(0, Math.min(1, dragStartShape.y1 + dy));
                            if (handleName.includes('b')) shape.y2 = Math.max(0, Math.min(1, dragStartShape.y2 + dy));
                        } else if (shape.type === 'arrow') {
                            if (handleName === 'start') {
                                shape.x1 = Math.max(0, Math.min(1, dragStartShape.x1 + dx));
                                shape.y1 = Math.max(0, Math.min(1, dragStartShape.y1 + dy));
                            } else if (handleName === 'end') {
                                shape.x2 = Math.max(0, Math.min(1, dragStartShape.x2 + dx));
                                shape.y2 = Math.max(0, Math.min(1, dragStartShape.y2 + dy));
                            }
                        }
                    }
                    isDirty = true;
                    redraw();
                    return;
                }

                // Hover style & cursor updates (only in select mode)
                if (activeTool === 'select') {
                    const w = canvas.width / dpr;
                    const h = canvas.height / dpr;
                    let cursorSet = false;

                    // 1. Check handles of selected shape
                    if (selectedShapeIdx !== -1) {
                        const shape = shapes[selectedShapeIdx];
                        const handle = getHandleAt(mouseX, mouseY, shape, w, h);
                        if (handle) {
                            canvas.style.cursor = handle.cursor;
                            cursorSet = true;
                        }
                    }

                    // 2. Check shape body
                    if (!cursorSet) {
                        const idx = getShapeAt(mouseX, mouseY);
                        if (idx !== -1) {
                            canvas.style.cursor = 'move';
                            if (hoveredShapeIdx !== idx) {
                                hoveredShapeIdx = idx;
                                redraw();
                            }
                        } else {
                            canvas.style.cursor = 'default';
                            if (hoveredShapeIdx !== -1) {
                                hoveredShapeIdx = -1;
                                redraw();
                            }
                        }
                    }
                }
            });

            window.addEventListener("pointerup", (e) => {
                if (isDrawing) {
                    isDrawing = false;
                    canvas.releasePointerCapture(e.pointerId);

                    const rect = canvas.getBoundingClientRect();
                    const mouseX = rect.width ? Math.max(0, Math.min(canvas.width / dpr, ((e.clientX - rect.left) / rect.width) * (canvas.width / dpr))) : 0;
                    const mouseY = rect.height ? Math.max(0, Math.min(canvas.height / dpr, ((e.clientY - rect.top) / rect.height) * (canvas.height / dpr))) : 0;
                    currentX = mouseX;
                    currentY = mouseY;

                    const w = canvas.width / dpr;
                    const h = canvas.height / dpr;

                    const normX1 = Math.max(0, Math.min(1, Math.min(startX, currentX) / w));
                    const normY1 = Math.max(0, Math.min(1, Math.min(startY, currentY) / h));
                    const normX2 = Math.max(0, Math.min(1, Math.max(startX, currentX) / w));
                    const normY2 = Math.max(0, Math.min(1, Math.max(startY, currentY) / h));

                    if (activeTool === 'rect') {
                        const pxWidth = Math.abs(currentX - startX);
                        const pxHeight = Math.abs(currentY - startY);
                        if (pxWidth > 6 && pxHeight > 6) {
                            pendingShape = {
                                type: 'rect',
                                x1: normX1,
                                y1: normY1,
                                x2: normX2,
                                y2: normY2,
                                color: activeColor,
                                label: ''
                            };
                            showPopover(currentX, currentY, "Label this box:");
                        }
                    } else if (activeTool === 'circle') {
                        const pxWidth = Math.abs(currentX - startX);
                        const pxHeight = Math.abs(currentY - startY);
                        if (pxWidth > 6 && pxHeight > 6) {
                            pendingShape = {
                                type: 'circle',
                                x1: normX1,
                                y1: normY1,
                                x2: normX2,
                                y2: normY2,
                                color: activeColor,
                                label: ''
                            };
                            showPopover(currentX, currentY, "Label this circle:");
                        }
                    } else if (activeTool === 'arrow') {
                        const length = Math.hypot(currentX - startX, currentY - startY);
                        if (length > 8) {
                            pendingShape = {
                                type: 'arrow',
                                x1: Math.max(0, Math.min(1, startX / w)),
                                y1: Math.max(0, Math.min(1, startY / h)),
                                x2: Math.max(0, Math.min(1, currentX / w)),
                                y2: Math.max(0, Math.min(1, currentY / h)),
                                color: activeColor,
                                label: ''
                            };
                            showPopover(currentX, currentY, "Label this arrow:");
                        }
                    } else if (activeTool === 'brush') {
                        if (pendingShape && pendingShape.points.length > 1) {
                            saveState();
                            shapes.push(pendingShape);
                            isDirty = true;
                        }
                        pendingShape = null;
                    } else if (activeTool === 'text') {
                        pendingShape = {
                            type: 'text',
                            x1: Math.max(0, Math.min(1, mouseX / w)),
                            y1: Math.max(0, Math.min(1, mouseY / h)),
                            x2: Math.max(0, Math.min(1, mouseX / w)),
                            y2: Math.max(0, Math.min(1, mouseY / h)),
                            color: activeColor,
                            text: ''
                        };
                        showPopover(mouseX, mouseY, "Type label text:");
                    }

                    redraw();
                }

                if (isDragging) {
                    isDragging = false;
                    dragMode = null;
                    dragStartShape = null;
                    if (selectedShapeIdx !== -1) {
                        normalizeShape(shapes[selectedShapeIdx]);
                    }
                    redraw();
                }
            });

            // DOUBLE CLICK TO EDIT DESCRIPTIONS
            canvas.addEventListener("dblclick", (e) => {
                if (activeTool !== 'select') return;
                const rect = canvas.getBoundingClientRect();
                const mouseX = rect.width ? Math.max(0, Math.min(canvas.width / dpr, ((e.clientX - rect.left) / rect.width) * (canvas.width / dpr))) : 0;
                const mouseY = rect.height ? Math.max(0, Math.min(canvas.height / dpr, ((e.clientY - rect.top) / rect.height) * (canvas.height / dpr))) : 0;

                const idx = getShapeAt(mouseX, mouseY);
                if (idx !== -1) {
                    const shape = shapes[idx];
                    if (shape.type === 'rect' || shape.type === 'circle' || shape.type === 'arrow' || shape.type === 'text') {
                        pendingShape = shape;
                        
                        let placeholder = "Edit description:";
                        let initialValue = "";
                        if (shape.type === 'rect' || shape.type === 'circle' || shape.type === 'arrow') {
                            placeholder = `Edit ${shape.type} description:`;
                            initialValue = shape.label || "";
                        } else if (shape.type === 'text') {
                            placeholder = "Edit text note:";
                            initialValue = shape.text || "";
                        }
                        
                        showPopover(mouseX, mouseY, placeholder);
                        popoverInput.value = initialValue;
                    }
                }
            });

            // FLOATING POPOVER LABEL CAPTURE
            function showPopover(clientX, clientY, placeholder) {
                const w = canvas.width / dpr;
                const h = canvas.height / dpr;
                const top = Math.max(10, Math.min(h - 50, clientY));
                const left = Math.max(10, Math.min(w - 180, clientX));

                popover.style.top = top + "px";
                popover.style.left = left + "px";
                popoverInput.value = "";
                popoverInput.placeholder = placeholder;
                popover.classList.remove("hidden");
                popoverInput.focus();
            }

            function hidePopover() {
                popover.classList.add("hidden");
                pendingShape = null;
            }

            function submitLabel() {
                const val = popoverInput.value.trim();
                if (pendingShape) {
                    saveState();
                    const isNew = !shapes.includes(pendingShape);
                    if (isNew && !val) {
                        // Discard new shapes with empty labels
                        hidePopover();
                        redraw();
                        return;
                    }

                    if (pendingShape.type === 'rect' || pendingShape.type === 'circle' || pendingShape.type === 'arrow') {
                        pendingShape.label = val;
                    } else if (pendingShape.type === 'text') {
                        pendingShape.text = val;
                    }

                    if (isNew) {
                        shapes.push(pendingShape);
                    }
                    isDirty = true;
                }
                hidePopover();
                redraw();
            }

            popoverInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    submitLabel();
                } else if (e.key === "Escape") {
                    hidePopover();
                    redraw();
                }
            });

            document.getElementById("btn-submit-label").addEventListener("click", submitLabel);

            // SHAPE DELETION
            function deleteSelectedShape() {
                if (selectedShapeIdx !== -1) {
                    saveState();
                    shapes.splice(selectedShapeIdx, 1);
                    selectShapeIdx(-1);
                    isDirty = true;
                    redraw();
                }
            }

            btnDelete.addEventListener("click", deleteSelectedShape);

            window.addEventListener("keydown", (e) => {
                if (e.key === "Delete" || e.key === "Backspace") {
                    if (document.activeElement !== popoverInput) {
                        deleteSelectedShape();
                    }
                } else if (e.ctrlKey && e.key.toLowerCase() === "z") {
                    e.preventDefault();
                    undo();
                } else if (e.ctrlKey && e.key.toLowerCase() === "y") {
                    e.preventDefault();
                    redo();
                }
            });

            // CLEAR ALL
            document.getElementById("btn-clear-all").addEventListener("click", () => {
                if (shapes.length > 0) {
                    if (confirm("Are you sure you want to clear all drawings?")) {
                        saveState();
                        shapes = [];
                        selectShapeIdx(-1);
                        isDirty = true;
                        redraw();
                    }
                }
            });

            function closeWindow() {
                const parentWin = window.opener || window.parent;
                if (parentWin && typeof parentWin.closeAnnotationPopup === "function") {
                    parentWin.closeAnnotationPopup();
                } else {
                    window.close();
                }
            }

            document.getElementById("btn-cancel").addEventListener("click", () => {
                isDirty = false;
                closeWindow();
            });

            document.getElementById("btn-apply").addEventListener("click", () => {
                isSaved = true;
                const parentWin = window.opener || window.parent;
                if (parentWin && typeof parentWin.saveAnnotationsFromPopup === "function") {
                    parentWin.saveAnnotationsFromPopup(index, shapes);
                }
                closeWindow();
            });

            if (btnUndo) btnUndo.addEventListener("click", undo);
            if (btnRedo) btnRedo.addEventListener("click", redo);

            document.getElementById("btn-cancel-label").addEventListener("click", () => {
                hidePopover();
                redraw();
            });

            // Zoom & Pan Functions
            const workspace = document.querySelector(".workspace");

            function updateZoomIndicator() {
                const zoomEl = document.getElementById("zoom-level");
                if (zoomEl) {
                    zoomEl.innerText = Math.round(zoom * 100) + "%";
                }
            }

            function resetZoom() {
                if (baseWidth === 0) return;
                zoom = 1.0;
                
                const w = baseWidth * zoom;
                const h = baseHeight * zoom;
                wrapper.style.width = w + "px";
                wrapper.style.height = h + "px";
                img.style.width = w + "px";
                img.style.height = h + "px";
                
                resizeCanvas();
                
                // Reset native scroll positions
                workspace.scrollLeft = 0;
                workspace.scrollTop = 0;
                
                updateZoomIndicator();
            }

            // Zoom relative to a screen coordinate on the workspace
            function zoomTo(factor, mouseX_screen, mouseY_screen) {
                if (baseWidth === 0) return;
                const minZoom = 0.5;
                const maxZoom = 20.0;
                const zoom_old = zoom;
                const zoom_new = Math.max(minZoom, Math.min(maxZoom, zoom_old * factor));
                
                if (zoom_new === zoom_old) return;
                
                // Save current scroll positions before resizing
                const scrollLeft = workspace.scrollLeft;
                const scrollTop = workspace.scrollTop;
                
                zoom = zoom_new;
                
                const w = baseWidth * zoom;
                const h = baseHeight * zoom;
                wrapper.style.width = w + "px";
                wrapper.style.height = h + "px";
                img.style.width = w + "px";
                img.style.height = h + "px";
                
                resizeCanvas();
                
                // Adjust scroll offsets so the point under the mouse stays under the mouse
                workspace.scrollLeft = (scrollLeft + mouseX_screen) * (zoom_new / zoom_old) - mouseX_screen;
                workspace.scrollTop = (scrollTop + mouseY_screen) * (zoom_new / zoom_old) - mouseY_screen;
                
                updateZoomIndicator();
            }

            function zoomToCenter(factor) {
                const workRect = workspace.getBoundingClientRect();
                zoomTo(factor, workRect.width / 2, workRect.height / 2);
            }

            // Wheel listener on workspace for Zooming (Ctrl+Scroll)
            workspace.addEventListener("wheel", (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                    const workRect = workspace.getBoundingClientRect();
                    const mouseX_screen = e.clientX - workRect.left;
                    const mouseY_screen = e.clientY - workRect.top;
                    
                    zoomTo(factor, mouseX_screen, mouseY_screen);
                }
                // When e.ctrlKey is false, we let the browser natively handle scrolling (horizontal side-wheel & vertical wheel)
            }, { passive: false });

            // Middle click drag to pan on workspace (native scroll based)
            workspace.addEventListener("pointerdown", (e) => {
                if (e.button === 1) { // Middle click / scroll wheel click
                    e.preventDefault();
                    isPanning = true;
                    panStartMouseX = e.clientX;
                    panStartMouseY = e.clientY;
                    panStartScrollLeft = workspace.scrollLeft;
                    panStartScrollTop = workspace.scrollTop;
                    workspace.style.cursor = "grabbing";
                    canvas.style.pointerEvents = "none";
                    workspace.setPointerCapture(e.pointerId);
                }
            });

            workspace.addEventListener("pointermove", (e) => {
                if (isPanning) {
                    if (!(e.buttons & 4)) {
                        isPanning = false;
                        workspace.style.cursor = "";
                        canvas.style.pointerEvents = "auto";
                        return;
                    }
                    const dx = e.clientX - panStartMouseX;
                    const dy = e.clientY - panStartMouseY;
                    workspace.scrollLeft = panStartScrollLeft - dx;
                    workspace.scrollTop = panStartScrollTop - dy;
                }
            });

            workspace.addEventListener("pointerup", (e) => {
                if (isPanning && e.button === 1) {
                    isPanning = false;
                    workspace.style.cursor = "";
                    canvas.style.pointerEvents = "auto";
                    try { workspace.releasePointerCapture(e.pointerId); } catch(err) {}
                }
            });

            workspace.addEventListener("pointercancel", (e) => {
                if (isPanning) {
                    isPanning = false;
                    workspace.style.cursor = "";
                    canvas.style.pointerEvents = "auto";
                }
            });

            // Cancel panning when window loses focus
            window.addEventListener("blur", () => {
                if (isPanning) {
                    isPanning = false;
                    workspace.style.cursor = "";
                    canvas.style.pointerEvents = "auto";
                }
            });

            // Double click empty space to reset zoom/pan
            workspace.addEventListener("dblclick", (e) => {
                if (e.target === workspace || e.target === wrapper || e.target === img) {
                    resetZoom();
                }
            });

            // Toolbar zoom buttons
            const btnZoomIn = document.getElementById("btn-zoom-in");
            const btnZoomOut = document.getElementById("btn-zoom-out");
            const btnZoomReset = document.getElementById("btn-zoom-reset");

            if (btnZoomIn) {
                btnZoomIn.addEventListener("click", () => {
                    zoomToCenter(1.25);
                });
            }
            if (btnZoomOut) {
                btnZoomOut.addEventListener("click", () => {
                    zoomToCenter(1 / 1.25);
                });
            }
            if (btnZoomReset) {
                btnZoomReset.addEventListener("click", resetZoom);
            }

            window.addEventListener("beforeunload", (e) => {
                if (isDirty && !isSaved) {
                    const msg = "You have unsaved annotation drawings. Are you sure you want to discard them?";
                    e.returnValue = msg;
                    return msg;
                }
            });
        })();
    </script>
</body>
</html>
